<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">BL RES GEN</title><desc id="desc">Les pages apparaissent en bas, grandissent au centre et se dupliquent en haut à gauche et à droite. Trois anneaux de flèches tournent en continu.</desc>
<defs>
