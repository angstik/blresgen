 <linearGradient id="yellow" x2="0" y2="1"><stop stop-color="#fffbd1"/><stop offset=".3" stop-color="#ffe854"/><stop offset=".65" stop-color="#ffc000"/><stop offset="1" stop-color="#cf7400"/></linearGradient>
 <linearGradient id="paper" x2=".2" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#c8e6f0"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000b18" flood-opacity=".5"/></filter>
