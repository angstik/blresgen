<style>
.source{animation:source 6s ease-in-out infinite}.left{animation:left 6s ease-in-out infinite}.right{animation:right 6s ease-in-out infinite}
.ring{animation:spin 8s linear infinite}.reverse{animation-direction:reverse;animation-duration:10s}
.spark{animation:shine 2.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes source{0%{opacity:0;transform:translate(195px,610px) scale(.2) rotate(-10deg)}12%{opacity:1}40%,55%{opacity:1;transform:translate(195px,452px) scale(1.12) rotate(8deg)}72%,100%{opacity:0;transform:translate(195px,430px) scale(1.12) rotate(8deg)}}
