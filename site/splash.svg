@keyframes right{0%,39%{opacity:0;transform:translate(195px,452px) scale(1.12) rotate(8deg)}45%{opacity:1}75%,88%{opacity:1;transform:translate(287px,320px) scale(.82) rotate(25deg)}100%{opacity:0;transform:translate(300px,295px) scale(.82) rotate(25deg)}}
@keyframes shine{0%,100%{opacity:.35}50%{opacity:1}}
